<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Me! - Guest Broadcast Studio</title>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f1218;
      --card-bg: #1a1e28;
      --accent: #00d2ff;
      --accent-hover: #00b4db;
      --danger: #ff3366;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #2d3342;
      --on-air: #ff0055;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 880px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    /* HEADER: ENLARGED LOGO WITHOUT SEPARATE "CALL ME" TEXT */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 16px rgba(0, 210, 255, 0.35);
      border: 2px solid var(--accent);
    }

    .badge-on-air {
      background: var(--on-air);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 680px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-box {
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      position: relative;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video element adapts faithfully: fills 16:9 in landscape, pillarboxes cleanly only when vertical/portrait */
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* When video is widescreen 16:9, ensure seamless edge-to-edge fill */
    video.widescreen-fit {
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 5;
    }

    /* SEMI-TRANSPARENT MINI VU METERS OVERLAY AT BOTTOM OF MONITORS */
    .monitor-audio-bar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(20, 26, 36, 0.65);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 5;
    }

    .monitor-audio-label {
      font-size: 0.62rem;
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: #94a3b8;
      width: 28px;
      white-space: nowrap;
    }

    .monitor-led-track {
      flex: 1;
      height: 6px;
      background: rgba(10, 14, 22, 0.8);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .monitor-led-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ff66 0%, #00ff66 70%, #ffcc00 85%, #ff2a2a 100%);
      transition: width 0.05s ease-out;
    }

    /* DEVICE SELECTOR ROW */
    .device-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
      background: #11141c;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    @media (max-width: 680px) {
      .device-row {
        grid-template-columns: 1fr;
      }
    }

    .device-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .device-col label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Action Buttons: Positioned directly below the monitors, identical button width, center seam aligned with monitors seam */
    .action-buttons-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px; /* Exactly matches .video-grid gap (16px) */
      margin-bottom: 16px;
      width: 100%;
    }

    .btn-action {
      flex: 0 1 200px;
      width: 200px;
      height: 48px;
      font-weight: 800;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s, transform 0.1s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn-connect {
      background: #00875a;
      border: 1px solid #00a86b;
      color: #fff;
    }

    .btn-connect:hover:not(:disabled) {
      background: #00a86b;
      transform: translateY(-1px);
    }

    .btn-disconnect {
      background: var(--danger);
      color: #fff;
    }

    .btn-disconnect:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.35 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }

    input, select {
      background: #11141c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .info-bar {
      background: #121620;
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }

    .status-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }

    .status-dot.connecting {
      background: #f7b731;
    }

    /* GUEST ALERT MODAL (Call Declined / Studio Disconnected) */
    .guest-alert-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 12, 18, 0.88);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: modalFadeIn 0.25s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .guest-alert-card {
      background: #141a26;
      border: 2px solid var(--accent);
      box-shadow: 0 12px 36px rgba(0, 210, 255, 0.35);
      border-radius: 10px;
      padding: 24px 28px;
      text-align: center;
      max-width: 420px;
      width: 88%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-sizing: border-box;
    }

    .guest-alert-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 210, 255, 0.15);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guest-alert-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .guest-alert-msg {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-guest-alert-ok {
      min-width: 130px;
      height: 42px;
      background: #00875a;
      border: 1px solid #00a86b;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-top: 6px;
    }

    .btn-guest-alert-ok:hover {
      background: #00a86b;
      transform: translateY(-1px);
    }

    /* INCOMING STUDIO CALL PROMPT MODAL (Accept / Decline) */
    .guest-prompt-actions {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      width: 100%;
    }

    .btn-prompt-accept {
      flex: 1;
      height: 44px;
      background: #00875a;
      border: 1px solid #00a86b;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-prompt-accept:hover {
      background: #00a86b;
      transform: translateY(-1px);
    }

    .btn-prompt-decline {
      flex: 1;
      height: 44px;
      background: #b01a35;
      border: 1px solid #d32f2f;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-prompt-decline:hover {
      background: #d32f2f;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header: Doubled Logo without separate Call Me text -->
    <div class="header">
      <div class="title-area">
        <img src="LogoCallMe_circle_white.png" class="logo-img" alt="Call Me!">
        <span id="onAirBadge" class="badge-on-air">● ON AIR</span>
      </div>
      <div>
        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Guest Broadcast Client</span>
      </div>
    </div>

    <!-- Video Grid -->
    <div class="video-grid">
      <!-- Guest Camera -->
      <div class="video-box">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="video-label">Your Camera (Sending to Studio)</span>
        <div class="monitor-audio-bar">
          <span class="monitor-audio-label">MIC</span>
          <div class="monitor-led-track"><div id="localMeterFill" class="monitor-led-fill"></div></div>
        </div>
      </div>

      <!-- Studio Return Feed -->
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="video-label">Studio Retorno (Mix-Minus)</span>
        <div class="monitor-audio-bar">
          <span class="monitor-audio-label">STUDIO</span>
          <div class="monitor-led-track"><div id="remoteMeterFill" class="monitor-led-fill"></div></div>
        </div>
      </div>
    </div>

    <!-- Action Buttons Bar: Directly below the monitors (centered on PC, directly under Studio Retorno on phones) -->
    <div class="action-buttons-panel">
      <!-- Hidden Studio Room ID so existing connection logic works seamlessly -->
      <input type="hidden" id="studioRoomId" value="callme-studio-live">
      <button id="connectBtn" class="btn-action btn-connect" onclick="startCall()">Connect</button>
      <button id="disconnectBtn" class="btn-action btn-disconnect" onclick="confirmDisconnect()" disabled>Disconnect</button>
    </div>

    <!-- Device Selectors & Audio Modes (Positioned below the action buttons) -->
    <div class="device-row">
      <div class="device-col">
        <label for="cameraSelect">Camera Device</label>
        <select id="cameraSelect" onchange="onCameraDeviceChanged()">
          <option value="">Detecting cameras...</option>
        </select>
      </div>
      <div class="device-col">
        <label for="micSelect">Microphone Device</label>
        <select id="micSelect" onchange="onMicDeviceChanged()">
          <option value="">Detecting microphones...</option>
        </select>
      </div>
      <div class="device-col" style="grid-column: span 2; display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08);">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 0.82rem; font-weight: 600; width: 100%;">
          <span style="white-space: nowrap;">Audio Mode:</span>
          <select id="audioModeSelect" onchange="onAudioModeChanged()" style="flex: 1; padding: 5px 10px; font-size: 0.82rem; border-radius: 6px; background: #131722; color: #fff; border: 1px solid var(--border); cursor: pointer;">
            <option value="standard" selected>📞 Standard Voice Call (Recommended: Zoom/Meet APM Engine)</option>
            <option value="studio">🎙️ High-Fidelity Original Sound (Headphones / External Mic)</option>
            <option value="noisy">🏢 Noisy Room (Enhanced Suppression)</option>
          </select>
        </label>
      </div>
      <div class="device-col" style="grid-column: span 2; display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08);">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 0.82rem; font-weight: 600; width: 100%;">
          <span style="white-space: nowrap;">Connection / Video:</span>
          <select id="videoQualitySelect" onchange="onVideoQualityChanged()" style="flex: 1; padding: 5px 10px; font-size: 0.82rem; border-radius: 6px; background: #131722; color: #fff; border: 1px solid var(--border); cursor: pointer;">
            <option value="wifi">⚡ Wi-Fi / Studio (1080p Full HD - Maximum Quality)</option>
            <option value="mobile" selected>📶 4G / 5G Mobile Data (720p HD - Saves 95% Data)</option>
            <option value="low">🚗 Low Signal / Street Reporter (540p - Extreme Saver)</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Telemetry Info Bar -->
    <div class="info-bar">
      <div>
        <span>My Guest ID: </span><strong id="myPeerId" style="color: var(--accent);">Registering...</strong>
      </div>
      <div class="status-badge">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Camera Active</span>
      </div>
    </div>
  </div>

  <!-- Guest Alert / Notification Modal -->
  <div id="guestAlertModal" class="guest-alert-modal">
    <div class="guest-alert-card">
      <div class="guest-alert-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="guest-alert-title" id="guestAlertTitle">NOTICE</div>
      <div class="guest-alert-msg" id="guestAlertMsg">Notification message</div>
      <button class="btn-guest-alert-ok" onclick="closeGuestAlert()">OK</button>
    </div>
  </div>

  <!-- Incoming Studio Call Modal (Prompting Guest to Accept or Decline) -->
  <div id="guestIncomingCallModal" class="guest-alert-modal">
    <div class="guest-alert-card">
      <div class="guest-alert-icon" style="animation: ringPulse 1.2s infinite;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </div>
      <div class="guest-alert-title">INCOMING STUDIO CALL</div>
      <div class="guest-alert-msg" id="guestIncomingCallMsg">The TV Studio Operator is calling you to connect On Air. Do you want to connect?</div>
      <div class="guest-prompt-actions">
        <button class="btn-prompt-accept" onclick="acceptStudioCall()">YES / CONNECT</button>
        <button class="btn-prompt-decline" onclick="declineStudioCall()">DECLINE</button>
      </div>
    </div>
  </div>

  <script>
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let studioDataConn = null;
    let callWasOnAir = false;

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const myPeerIdEl = document.getElementById('myPeerId');
    const onAirBadge = document.getElementById('onAirBadge');
    const cameraSelect = document.getElementById('cameraSelect');
    const micSelect = document.getElementById('micSelect');
    const guestAlertModal = document.getElementById('guestAlertModal');
    const guestAlertTitle = document.getElementById('guestAlertTitle');
    const guestAlertMsg = document.getElementById('guestAlertMsg');

    // UI Alert Modal helper functions
    function showGuestAlert(title, message) {
      if (guestAlertTitle) guestAlertTitle.innerText = title;
      if (guestAlertMsg) guestAlertMsg.innerText = message;
      if (guestAlertModal) guestAlertModal.style.display = 'flex';
    }

    function closeGuestAlert() {
      if (guestAlertModal) guestAlertModal.style.display = 'none';
    }

    let pendingStudioCall = null;
    const guestIncomingCallModal = document.getElementById('guestIncomingCallModal');
    const guestIncomingCallMsg = document.getElementById('guestIncomingCallMsg');

    // Announce guest presence to studio room so the operator knows which guest is currently online
    function announcePresenceToStudio() {
      if (!peer || !peer.id) return;
      try {
        const targetStudioId = document.getElementById('studioRoomId').value.trim();
        if (!targetStudioId) return;
        const isMob = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const deviceType = isMob ? 'Mobile' : 'PC';

        const sendPresence = (conn) => {
          try {
            conn.send({
              type: 'guest_presence',
              guestId: peer.id,
              device: deviceType,
              timestamp: Date.now()
            });
          } catch(e){}
        };

        if (studioDataConn && studioDataConn.open) {
          sendPresence(studioDataConn);
        } else {
          const regConn = peer.connect(targetStudioId, { reliable: true });
          regConn.on('open', () => {
            sendPresence(regConn);
            setupStudioDataConn(regConn);
          });
          regConn.on('error', (err) => {
            console.warn("Studio registration connection error:", err);
          });
        }
      } catch (e) {
        console.warn("Could not announce presence to studio:", e);
      }
    }

    // Keep presence alive every 10 seconds so studio list is always fresh
    setInterval(() => {
      announcePresenceToStudio();
    }, 10000);

    // Attach data connection handlers to receive operator signals (declined, disconnected, etc.)
    function setupStudioDataConn(conn) {
      studioDataConn = conn;
      conn.on('data', (data) => {
        if (!data) return;
        if (data.type === 'call_declined') {
          hangUp(false);
          showGuestAlert("CALL DECLINED", "The studio operator has declined your incoming call.");
        } else if (data.type === 'operator_disconnected') {
          hangUp(false);
          showGuestAlert("DISCONNECTED", "You have been disconnected from the studio.");
        } else if (data.type === 'studio_discovery_ping') {
          announcePresenceToStudio();
        }
      });
      conn.on('close', () => {
        if (studioDataConn === conn) studioDataConn = null;
      });
    }

    // Guest prompt actions when Studio calls the guest
    async function acceptStudioCall() {
      if (guestIncomingCallModal) guestIncomingCallModal.style.display = 'none';
      if (!pendingStudioCall) return;

      if (!localStream) {
        await startCameraPreview();
      }

      callWasOnAir = true;
      activeCall = pendingStudioCall;
      pendingStudioCall = null;

      activeCall.answer(localStream);
      setupCallHandlers(activeCall);

      statusText.innerText = "ON AIR (Connected to Studio)";
      statusDot.className = "status-dot connected";
      onAirBadge.style.display = "inline-block";
      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
    }

    function declineStudioCall() {
      if (guestIncomingCallModal) guestIncomingCallModal.style.display = 'none';

      if (pendingStudioCall) {
        const callerPeer = pendingStudioCall.peer;
        try {
          if (studioDataConn && studioDataConn.peer === callerPeer && studioDataConn.open) {
            studioDataConn.send({ type: 'guest_call_declined', callerId: (peer ? peer.id : 'Guest') });
          } else {
            const declConn = peer.connect(callerPeer);
            declConn.on('open', () => {
              declConn.send({ type: 'guest_call_declined', callerId: (peer ? peer.id : 'Guest') });
              setTimeout(() => declConn.close(), 1000);
            });
          }
        } catch(e){}

        setTimeout(() => {
          try { if (pendingStudioCall) pendingStudioCall.close(); } catch(e){}
          pendingStudioCall = null;
        }, 350);
      }

      statusText.innerText = "Ready to connect to Studio";
      statusDot.className = "status-dot";
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
    }

    // 1. Initialize Peer Broker
    function initPeer() {
      if (peer) {
        try { peer.destroy(); } catch(e){}
        peer = null;
      }

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerIdEl.innerText = id;
        statusText.innerText = "Ready to connect to Studio";
        // Notify the studio app that this guest is active and available
        announcePresenceToStudio();
      });

      peer.on('connection', (conn) => {
        setupStudioDataConn(conn);
      });

      peer.on('disconnected', () => {
        statusText.innerText = "Reconnecting to server...";
        try { peer.reconnect(); } catch(e){}
      });

      peer.on('error', (err) => {
        console.error("Peer error:", err);
        if (err.type === 'peer-unavailable') {
          statusText.innerText = "Studio is currently offline or registering. Please retry in a moment.";
        } else if (err.type === 'network' || err.type === 'server-error') {
          statusText.innerText = "Network reconnection... Retrying";
          setTimeout(() => {
            try { if (peer && !peer.destroyed) peer.reconnect(); } catch(e){}
          }, 3000);
        } else {
          statusText.innerText = "Status: " + err.type;
        }
        statusDot.className = "status-dot";
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
      });

      // Handle call initiated by the TV Studio Operator to this guest
      peer.on('call', async (incomingCall) => {
        console.log("Incoming call from Studio operator:", incomingCall.peer);
        
        // If already in an active on-air call, ignore/decline
        if (activeCall) {
          try {
            const rejectConn = peer.connect(incomingCall.peer);
            rejectConn.on('open', () => {
              rejectConn.send({ type: 'guest_call_declined', reason: 'busy' });
              setTimeout(() => { rejectConn.close(); incomingCall.close(); }, 500);
            });
          } catch(e) {
            try { incomingCall.close(); } catch(err){}
          }
          return;
        }

        pendingStudioCall = incomingCall;

        if (guestIncomingCallMsg) {
          guestIncomingCallMsg.innerText = `The TV Studio Operator is calling you to connect On Air. Do you want to connect?`;
        }
        if (guestIncomingCallModal) {
          guestIncomingCallModal.style.display = 'flex';
        }

        statusText.innerText = "RINGING - Incoming call from Studio...";
        statusDot.className = "status-dot connecting";
      });
    }

    // 2. Enumerate Cameras and Microphones into dropdowns
    async function populateDeviceLists(currentCamId = null, currentMicId = null) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const audioDevices = devices.filter(d => d.kind === 'audioinput');

        const activeCamVal = currentCamId || cameraSelect.value;
        const activeMicVal = currentMicId || micSelect.value;

        cameraSelect.innerHTML = '';
        micSelect.innerHTML = '';

        videoDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          let label = dev.label || `Camera ${idx + 1}`;
          opt.text = label;
          cameraSelect.appendChild(opt);
        });

        audioDevices.forEach((dev, idx) => {
          const opt = document.createElement('option');
          opt.value = dev.deviceId;
          let label = dev.label || `Microphone ${idx + 1}`;
          opt.text = label;
          micSelect.appendChild(opt);
        });

        if (videoDevices.length === 0) {
          cameraSelect.innerHTML = '<option value="">No camera detected</option>';
        } else if (activeCamVal && videoDevices.some(d => d.deviceId === activeCamVal)) {
          cameraSelect.value = activeCamVal;
        }

        if (audioDevices.length === 0) {
          micSelect.innerHTML = '<option value="">No microphone detected</option>';
        } else if (activeMicVal && audioDevices.some(d => d.deviceId === activeMicVal)) {
          micSelect.value = activeMicVal;
        }
      } catch (err) {
        console.warn("Could not enumerate devices:", err);
      }
    }

    // 3. Start Camera Immediately on Page Load (Self-Confidence Monitor)
    async function startCameraPreview(selectedCamId = null, selectedMicId = null) {
      // Cleanly stop any existing stream tracks first so mobile browsers release camera lock
      if (localStream) {
        localStream.getTracks().forEach(t => {
          try { t.stop(); } catch(e){}
        });
        localStream = null;
      }

      // Determine video capture constraints based on selected connection profile (Wi-Fi 1080p, Mobile 720p, Low Signal 540p)
      const qMode = document.getElementById('videoQualitySelect') ? document.getElementById('videoQualitySelect').value : 'wifi';
      let targetW = 1920, targetH = 1080;
      if (qMode === 'mobile') {
        targetW = 1280;
        targetH = 720;
      } else if (qMode === 'low') {
        targetW = 960;
        targetH = 540;
      }

      let videoConstraints = {
        width: { ideal: targetW },
        height: { ideal: targetH },
        aspectRatio: { ideal: 1.7777777778 }
      };

      if (selectedCamId) {
        videoConstraints.deviceId = { exact: selectedCamId };
      } else {
        videoConstraints.facingMode = { ideal: 'user' };
      }

      const audioMode = document.getElementById('audioModeSelect').value;

      let audioConstraintsConfig;
      let targetContentHint = 'speech';

      if (audioMode === 'standard') {
        // Mode 1: Standard Voice Call (Google Meet / Zoom Default Engine)
        // Uses native WebRTC Audio Processing Module: AEC3 (acoustic echo cancellation),
        // AGC2 (digital peak limiter & adaptive speech leveller), and Wiener noise suppression.
        targetContentHint = 'speech';
        audioConstraintsConfig = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          googEchoCancellation: true,
          googAutoGainControl: true,
          googNoiseSuppression: true,
          googHighpassFilter: true,
          channelCount: 1,
          sampleRate: 48000
        };
      } else if (audioMode === 'studio') {
        // Mode 2: High-Fidelity Original Sound (Zoom "Original Sound for Musicians")
        // Disables all browser DSP and instructs OS/browser to bypass VOIP telephony filters.
        targetContentHint = 'music';
        audioConstraintsConfig = {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          googEchoCancellation: false,
          googEchoCancellation2: false,
          googNoiseSuppression: false,
          googNoiseSuppression2: false,
          googAutoGainControl: false,
          googAutoGainControl2: false,
          googHighpassFilter: false,
          googTypingNoiseDetection: false,
          channelCount: 1,
          sampleRate: 48000
        };
      } else {
        // Mode 3: Noisy Room (Enhanced Suppression)
        targetContentHint = 'speech';
        audioConstraintsConfig = {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          googEchoCancellation: true,
          googNoiseSuppression: true,
          googNoiseSuppression2: true,
          googHighpassFilter: true,
          googTypingNoiseDetection: true,
          channelCount: 1,
          sampleRate: 48000
        };
      }

      const audioConstraints = selectedMicId
        ? {
            deviceId: { exact: selectedMicId },
            ...audioConstraintsConfig
          }
        : audioConstraintsConfig;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: audioConstraints
        });

        const aTrack = localStream.getAudioTracks()[0];
        if (aTrack && 'contentHint' in aTrack) {
          aTrack.contentHint = targetContentHint;
        }

        localVideo.srcObject = localStream;
        setupLocalAudioMeter(localStream);

        // Auto-detect aspect ratio: if camera resolution is ~16:9, apply widescreen-fit so zero artificial black borders exist
        localVideo.onloadedmetadata = () => {
          const vw = localVideo.videoWidth;
          const vh = localVideo.videoHeight;
          if (vw > 0 && vh > 0) {
            const aspect = vw / vh;
            if (aspect >= 1.65 && aspect <= 1.85) {
              localVideo.classList.add('widescreen-fit');
            } else {
              localVideo.classList.remove('widescreen-fit');
            }
          }
        };

        // Get currently active video device ID from stream track
        const activeTrack = localStream.getVideoTracks()[0];
        const activeSettings = activeTrack ? activeTrack.getSettings() : {};
        const activeDevId = selectedCamId || activeSettings.deviceId;

        await populateDeviceLists(activeDevId, selectedMicId);
        return localStream;
      } catch (err) {
        console.warn("Retrying with relaxed camera constraints:", err);
        try {
          const fallbackVideo = selectedCamId 
            ? { deviceId: { exact: selectedCamId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
            : { width: { ideal: 1920 }, height: { ideal: 1080 } };

          localStream = await navigator.mediaDevices.getUserMedia({
            video: fallbackVideo,
            audio: audioConstraints
          });
          localVideo.srcObject = localStream;
          setupLocalAudioMeter(localStream);
          await populateDeviceLists(selectedCamId, selectedMicId);
          return localStream;
        } catch (e2) {
          console.error("Camera access failed:", e2);
          statusText.innerText = "Camera Blocked/Unavailable";
        }
      }
    }

    async function onAudioModeChanged() {
      const camId = cameraSelect.value;
      const micId = micSelect.value;
      await startCameraPreview(camId, micId);
      replaceTracksInCall();
    }

    async function onVideoQualityChanged() {
      const camId = cameraSelect.value;
      const micId = micSelect.value;
      await startCameraPreview(camId, micId);
      replaceTracksInCall();
      applyVideoBitrateCeiling();
    }

    // Web Audio Analysers for Guest VU Meters
    let audioCtx = null;
    let localAnalyser = null;
    let remoteAnalyser = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function setupLocalAudioMeter(stream) {
      try {
        if (!stream || stream.getAudioTracks().length === 0) return;
        const ctx = getAudioContext();
        const source = ctx.createMediaStreamSource(stream);
        localAnalyser = ctx.createAnalyser();
        localAnalyser.fftSize = 128;
        source.connect(localAnalyser);

        const data = new Uint8Array(localAnalyser.frequencyBinCount);
        const fill = document.getElementById('localMeterFill');

        function loop() {
          if (!localAnalyser) return;
          localAnalyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          const level = Math.min(100, Math.round((avg / 128) * 115));
          if (fill) fill.style.width = level + '%';
          requestAnimationFrame(loop);
        }
        loop();
      } catch (e) {
        console.warn("Could not start local audio meter:", e);
      }
    }

    function setupRemoteAudioMeter(stream) {
      try {
        if (!stream || stream.getAudioTracks().length === 0) return;
        const ctx = getAudioContext();
        const source = ctx.createMediaStreamSource(stream);
        remoteAnalyser = ctx.createAnalyser();
        remoteAnalyser.fftSize = 128;
        source.connect(remoteAnalyser);

        const data = new Uint8Array(remoteAnalyser.frequencyBinCount);
        const fill = document.getElementById('remoteMeterFill');

        function loop() {
          if (!remoteAnalyser) return;
          remoteAnalyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          const level = Math.min(100, Math.round((avg / 128) * 115));
          if (fill) fill.style.width = level + '%';
          requestAnimationFrame(loop);
        }
        loop();
      } catch (e) {
        console.warn("Could not start remote audio meter:", e);
      }
    }

    // Handlers when user chooses a different camera or microphone from dropdown
    async function onCameraDeviceChanged() {
      const camId = cameraSelect.value;
      const micId = micSelect.value;
      await startCameraPreview(camId, micId);
      replaceTracksInCall();
    }

    async function onMicDeviceChanged() {
      const camId = cameraSelect.value;
      const micId = micSelect.value;
      await startCameraPreview(camId, micId);
      replaceTracksInCall();
    }

    function replaceTracksInCall() {
      if (activeCall && activeCall.peerConnection && localStream) {
        const audioMode = document.getElementById('audioModeSelect').value;
        const targetHint = (audioMode === 'studio') ? 'music' : 'speech';
        const senders = activeCall.peerConnection.getSenders();
        const vTrack = localStream.getVideoTracks()[0];
        const aTrack = localStream.getAudioTracks()[0];
        if (vTrack) {
          const vs = senders.find(s => s.track && s.track.kind === 'video');
          if (vs) vs.replaceTrack(vTrack);
        }
        if (aTrack) {
          if ('contentHint' in aTrack) {
            aTrack.contentHint = targetHint;
          }
          const as = senders.find(s => s.track && s.track.kind === 'audio');
          if (as) as.replaceTrack(aTrack);
        }
      }
    }

    // 4. Connect to Studio
    async function startCall() {
      const targetStudioId = document.getElementById('studioRoomId').value.trim();
      if (!targetStudioId) {
        alert("Please specify Studio Room ID");
        return;
      }

      if (!localStream) {
        await startCameraPreview();
      }

      callWasOnAir = false;
      statusText.innerText = "Calling Studio (Ringing / Waiting for Operator)...";
      statusDot.className = "status-dot connecting";

      // Connect signaling data connection to studio operator
      try {
        const conn = peer.connect(targetStudioId);
        setupStudioDataConn(conn);
      } catch (err) {
        console.warn("Could not open data channel to studio:", err);
      }

      const call = peer.call(targetStudioId, localStream);
      activeCall = call;
      setupCallHandlers(call);

      connectBtn.disabled = true;
      disconnectBtn.disabled = false;
    }

    // Optimize SDP to enforce transparent broadcast studio Opus profile (48kHz, 128kbps, fullband, NO bubbling/DTX)
    function optimizeOpusSdp(sdp) {
      if (!sdp) return sdp;
      let lines = sdp.split('\r\n');
      let opusPayload = null;
      for (let i = 0; i < lines.length; i++) {
        const mMatch = lines[i].match(/^a=rtpmap:(\d+)\s+opus\/48000/i);
        if (mMatch) {
          opusPayload = mMatch[1];
          break;
        }
      }
      if (opusPayload) {
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].startsWith(`a=fmtp:${opusPayload}`)) {
            // usedtx=0 (stops bubbling/water artifact), cbr=1 (constant bitrate, no fluctuating compression)
            lines[i] = `a=fmtp:${opusPayload} minptime=10;useinbandfec=1;usedtx=0;cbr=1;maxaveragebitrate=128000;stereo=1;sprop-stereo=1`;
          }
        }
      }
      return lines.join('\r\n');
    }

    function applyVideoBitrateCeiling() {
      if (!activeCall || !activeCall.peerConnection) return;
      try {
        const pc = activeCall.peerConnection;
        const qMode = document.getElementById('videoQualitySelect') ? document.getElementById('videoQualitySelect').value : 'wifi';
        let maxVideoBitrate = 4500000; // Wi-Fi / Fiber Studio: up to 4.5 Mbps
        let scaleDown = 1.0;

        if (qMode === 'mobile') {
          maxVideoBitrate = 1800000; // 4G/5G Cellular: 1.8 Mbps ceiling (~65 MB for 5 min)
          scaleDown = 1.0;
        } else if (qMode === 'low') {
          maxVideoBitrate = 900000;  // Low Signal: 900 kbps ceiling (~30 MB for 5 min)
          scaleDown = 1.0;
        }

        const senders = pc.getSenders();
        senders.forEach(sender => {
          if (sender.track && sender.track.kind === 'video') {
            const params = sender.getParameters();
            if (params && params.encodings && params.encodings.length > 0) {
              params.encodings[0].maxBitrate = maxVideoBitrate;
              if (qMode === 'mobile') {
                params.encodings[0].maxFramerate = 30;
              } else if (qMode === 'low') {
                params.encodings[0].maxFramerate = 25;
              }
              sender.setParameters(params).catch(e => console.warn("Video params set:", e));
            }
          }
        });
      } catch (err) {
        console.warn("Could not apply video bitrate ceiling:", err);
      }
    }

    function setupCallHandlers(call) {
      if (call.peerConnection) {
        const pc = call.peerConnection;

        // Intercept SDP to inject broadcast-quality Opus profile
        const originalSetLocalDescription = pc.setLocalDescription.bind(pc);
        pc.setLocalDescription = function(desc) {
          if (desc && desc.sdp) {
            desc.sdp = optimizeOpusSdp(desc.sdp);
          }
          return originalSetLocalDescription(desc);
        };

        try {
          const senders = pc.getSenders();
          senders.forEach(sender => {
            if (sender.track && sender.track.kind === 'audio') {
              const params = sender.getParameters();
              if (params && params.encodings && params.encodings.length > 0) {
                params.encodings[0].maxBitrate = 128000; // 128kbps high fidelity studio broadcast speech
                params.encodings[0].priority = 'high';
                params.encodings[0].networkPriority = 'high';
                sender.setParameters(params).catch(e => {});
              }
            }
          });
        } catch(e) {}

        // Apply selected video profile bitrate ceiling
        applyVideoBitrateCeiling();
      }

      call.on('stream', (remoteStream) => {
        callWasOnAir = true;
        remoteVideo.srcObject = remoteStream;
        setupRemoteAudioMeter(remoteStream);

        // Mobile Chrome / Android: Ensure communication mode playout with low latency
        try {
          if (!window.remoteAudioEl) {
            window.remoteAudioEl = new Audio();
            window.remoteAudioEl.autoplay = true;
            window.remoteAudioEl.playsInline = true;
          }
          window.remoteAudioEl.srcObject = remoteStream;
          window.remoteAudioEl.play().catch(e => console.warn("Remote audio play:", e));
          // Keep remoteVideo unmuted only if remoteAudioEl fails
          remoteVideo.muted = true;
        } catch(e) {
          remoteVideo.muted = false;
        }

        statusText.innerText = "ON AIR (Connected to Studio)";
        statusDot.className = "status-dot connected";
        onAirBadge.style.display = "inline-block";
      });

      call.on('close', () => {
        const wasOnAir = callWasOnAir;
        hangUp(false);
        if (!wasOnAir) {
          // If the studio operator declined while ringing before sending media
          showGuestAlert("CALL DECLINED", "The studio operator has declined your incoming call.");
        }
      });

      call.on('error', (err) => {
        console.error("Call error:", err);
        hangUp(false);
      });
    }

    function confirmDisconnect() {
      if (confirm("Are you sure you want to disconnect from the broadcast?")) {
        hangUp(true);
      }
    }

    function hangUp(userInitiated = false) {
      if (userInitiated && studioDataConn && studioDataConn.open) {
        try {
          studioDataConn.send({ type: 'guest_disconnected', callerId: (peer ? peer.id : 'Remote Guest') });
        } catch (e) {}
      }

      if (activeCall) {
        try { activeCall.close(); } catch(e){}
        activeCall = null;
      }
      if (remoteVideo.srcObject) {
        remoteVideo.srcObject.getTracks().forEach(t => t.stop());
        remoteVideo.srcObject = null;
      }
      const remoteFill = document.getElementById('remoteMeterFill');
      if (remoteFill) remoteFill.style.width = '0%';

      callWasOnAir = false;
      statusText.innerText = "Ready to connect to Studio";
      statusDot.className = "status-dot";
      onAirBadge.style.display = "none";
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
    }

    // Initialize on page load: start preview right away so the user sees themselves
    window.addEventListener('DOMContentLoaded', async () => {
      // Smart Auto-detection: If running on PC/Notebook or on Wi-Fi, default to Wi-Fi HD; if mobile phone, default to Mobile Data Saver
      try {
        const isMob = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const qSelect = document.getElementById('videoQualitySelect');
        if (qSelect) {
          if (!isMob) {
            // PC / Notebook calling from office/home/hotel fiber
            qSelect.value = 'wifi';
          } else {
            // Mobile phone: check if NetworkInformation API reports wifi vs cellular
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn && conn.type === 'wifi') {
              qSelect.value = 'wifi';
            } else {
              qSelect.value = 'mobile';
            }
          }
        }
      } catch (e) {}

      await startCameraPreview();
      initPeer();
    });

    window.addEventListener('beforeunload', () => {
      if (studioDataConn && studioDataConn.open && peer) {
        try {
          studioDataConn.send({ type: 'guest_leaving', guestId: peer.id });
        } catch(e){}
      }
      if (peer) {
        try { peer.destroy(); } catch(e){}
      }
    });
  </script>
</body>
